[env]
# DATABASE_URL="postgres://postgres:postgres@localhost:5431/meshtastic"

[target.x86_64-unknown-linux-musl]
rustflags = [
  "-L",
  "/usr/lib",
  "-L",
  "/usr/lib/postgresql15",
  "-l",
  "static=pgcommon",
  "-l",
  "static=pgport",
  "-l",
  "static=pgfeutils",
  "-l",
  "static=ssl",
  "-l",
  "static=crypto",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
  "-L",
  "/usr/lib",
  "-L",
  "/usr/lib/postgresql15",
  "-l",
  "static=pgcommon",
  "-l",
  "static=pgport",
  "-l",
  "static=pgfeutils",
  "-l",
  "static=ssl",
  "-l",
  "static=crypto",
]
